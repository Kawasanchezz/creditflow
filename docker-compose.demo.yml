# MODO DEMONSTRACAO para avaliacao local: sem senha na tela de login e com dados de exemplo.
# As credenciais abaixo sao publicas e servem so para esta demonstracao; nao use fora da sua maquina.
#   docker compose -f docker-compose.demo.yml up --build
name: creditflow-demo

services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: creditflow
      POSTGRES_USER: creditflow
      POSTGRES_PASSWORD: demo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  score-mock:
    image: wiremock/wiremock:3.13.2-3@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    volumes:
      - ./wiremock:/home/wiremock:ro

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      score-mock:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/creditflow
      DB_USER: creditflow
      DB_PASSWORD: demo-db
      SCORE_URL: http://score-mock:8080
      CREDITFLOW_SECURITY_ANALYSTPASSWORD: demo-analista
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_1: demo-cliente
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_2: demo-cliente
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_3: demo-cliente
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_4: demo-cliente
      CREDITFLOW_DEMO_ENABLED: "true"
      CREDITFLOW_DEMO_SEEDDATA: "true"
      SWAGGER_UI_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
