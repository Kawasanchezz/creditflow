services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creditflow
      POSTGRES_USER: creditflow
      POSTGRES_PASSWORD: creditflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  score-mock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      score-mock:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/creditflow
      DB_USER: creditflow
      DB_PASSWORD: creditflow
      SCORE_URL: http://score-mock:8080
    ports:
      - "8080:8080"
