services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: creditflow
      POSTGRES_USER: ${DB_USER:-creditflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env (copie de .env.example)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  score-mock:
    image: wiremock/wiremock:3.9.1@sha256:8fe02bc3f9b63deb1454d41750dbaf081adf4b3e8c74fd8e31f790bee5647b88
    volumes:
      - ./wiremock:/home/wiremock:ro

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      score-mock:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/creditflow
      DB_USER: ${DB_USER:-creditflow}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env (copie de .env.example)}
      SCORE_URL: http://score-mock:8080
      CREDITFLOW_SECURITY_ANALYSTPASSWORD: ${ANALYST_PASSWORD:?defina ANALYST_PASSWORD no .env}
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_1: ${CUSTOMER_PASSWORD:?defina CUSTOMER_PASSWORD no .env}
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_2: ${CUSTOMER_PASSWORD}
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_3: ${CUSTOMER_PASSWORD}
      CREDITFLOW_SECURITY_CUSTOMERPASSWORDS_4: ${CUSTOMER_PASSWORD}
      SWAGGER_UI_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
